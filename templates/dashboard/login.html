
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Staff Login | Heat Shield</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            padding: 32px;
            border-radius: 12px;
            width: min(90%, 380px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #243047;
        }

        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b9c1ce;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            background: #145a8d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid #f5a623;
            outline-offset: 2px;
        }

        .error {
            color: #a12020;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>Heat Shield Staff Login</h1>
        <p>Sign in to access staff functions.</p>

        {% if form.errors %}
            <p class="error" role="alert">
                Invalid username or password.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="id_username">Username</label>
            {{ form.username }}

            <label for="id_password">Password</label>
            {{ form.password }}

            <input type="hidden"
                   name="next"
                   value="{{ next }}">

            <button type="submit">Sign In</button>
        </form>
    </main>
</body>
</html>
